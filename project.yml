name: MDLook
options:
  bundleIdPrefix: com.sokei
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MDLook:
    type: application
    platform: macOS
    sources:
      - App/MDLook
    dependencies:
      - target: MDLookExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sokei.MDLook
        INFOPLIST_FILE: App/MDLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MDLook/MDLook.entitlements
  MDLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - App/MDLookExtension
      - Sources/MarkdownPreviewCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sokei.MDLook.MDLookExtension
        INFOPLIST_FILE: App/MDLookExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MDLookExtension/MDLookExtension.entitlements
        SKIP_INSTALL: "YES"
