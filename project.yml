name: MDLook
options:
  bundleIdPrefix: com.sokei
  deploymentTarget:
    macOS: "26.0"
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: 0.8.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MDLook:
    type: application
    platform: macOS
    sources:
      - App/MDLook
      - Sources/MDLookAppSupport
      - path: App/MDLook/Assets.xcassets
        type: asset
    dependencies:
      - target: MDLookExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sokei.MDLook
        INFOPLIST_FILE: App/MDLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MDLook/MDLook.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MDLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - App/MDLookExtension
      - Sources/MarkdownPreviewCore
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sokei.MDLook.MDLookExtension
        INFOPLIST_FILE: App/MDLookExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MDLookExtension/MDLookExtension.entitlements
        SKIP_INSTALL: "YES"
