name: MarkdownQuickLookPreview
options:
  bundleIdPrefix: com.sokei
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MarkdownQuickLookPreview:
    type: application
    platform: macOS
    sources:
      - App/MarkdownQuickLookPreview
    dependencies:
      - target: MarkdownPreviewExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sokei.MarkdownQuickLookPreview
        INFOPLIST_FILE: App/MarkdownQuickLookPreview/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MarkdownQuickLookPreview/MarkdownQuickLookPreview.entitlements
  MarkdownPreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - App/MarkdownPreviewExtension
      - Sources/MarkdownPreviewCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sokei.MarkdownQuickLookPreview.MarkdownPreviewExtension
        INFOPLIST_FILE: App/MarkdownPreviewExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MarkdownPreviewExtension/MarkdownPreviewExtension.entitlements
        SKIP_INSTALL: "YES"

